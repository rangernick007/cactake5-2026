{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
        <section class="max-w-md mx-auto my-auto w-full bg-white p-6 rounded-lg border border-slate-200 shadow-sm space-y-4">
            <div class="border-b border-slate-100 pb-3">
                <h2 class="text-xl font-bold text-slate-900">Log in</h2>
                <p class="text-xs text-slate-500 mt-0.5">Welcome back to Collegia.</p>
            </div>
            <form method="post" action="{{ url_for('login') }}" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div>
                    <label for="email" class="block text-xs font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" autofocus class="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="password" class="block text-xs font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" class="btn-primary btn-lg w-full">Log in</button>
            </form>
            <p class="text-xs text-slate-500 text-center">New here? <a href="{{ url_for('register') }}" class="text-indigo-600 font-medium">Create an account</a></p>
        </section>
{% endblock %}
